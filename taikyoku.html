<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>対局｜麻雀〜do the math〜</title>
<!-- ★/r/<token> からも開く（vercel.json の書き換え）＝素材は全部 / から書く★ -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/gamen.css">
<script src="/js/supa-config.js"></script>
<script src="/js/env-badge.js"></script>
<script src="/vendor/supabase-2.112.4.js"></script>
<script src="/vendor/qrcode-generator.js"></script>
<script src="/js/exally-login.js"></script>
<script src="/js/sw-reg.js" defer></script>
</head>
<body>
<header class="appbar"><a class="back" id="barBack" href="/index.html">‹ ホーム</a><h1 id="title">対局</h1><a class="bar-r" id="barTen" hidden>点数</a><button type="button" class="bar-r" id="barR" hidden></button></header>
<main>
<div id="obi" class="obi" hidden></div>

<!-- ログインを待つ -->
<section id="vLogin" class="view" hidden>
  <p class="setsumei">対局の部屋はアカウントごとに残ります。ログインしてください。</p>
  <button class="btn btn-main" type="button" id="btnLoginOpen">ログイン・新規登録</button>
</section>

<!-- ⑧ ［対局を始める］（部屋なし・既定）／みんなで見る部屋を作る・入る（gamen_b3a_sadame v1.1）＝切り替えで片方だけ出す -->
<section id="vChoose" class="view" hidden>
  <button class="btn btn-main" type="button" id="btnStart">対局を始める</button>
  <p class="sec">みんなで見る</p>
  <div class="seg" id="chSeg">
    <button type="button" data-p="pMake" aria-pressed="true">部屋を作る</button>
    <button type="button" data-p="pJoin" aria-pressed="false">部屋に入る</button>
  </div>
  <div id="pMake" class="h-pane">
    <div class="list">
      <label class="li"><span>部屋名</span><input class="h-in" id="cName" maxlength="40" autocomplete="off" placeholder="金曜の会"></label>
      <label class="li"><span>パス（数字4つ）</span><input class="h-in" id="cPass" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="err" id="cErr0"></div>
    <button class="btn btn-main" type="button" id="goRules">次へ（ルールを決める）</button>
  </div>
  <div id="pJoin" class="h-pane" hidden>
    <div class="list">
      <label class="li"><span>部屋名</span><input class="h-in" id="jName" maxlength="40" autocomplete="off" placeholder="金曜の会"></label>
      <label class="li"><span>パス</span><input class="h-in" id="jPass" type="password" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="err" id="jErr"></div>
    <button class="btn btn-line" type="button" id="btnJoin">入る</button>
    <p class="r-hint h-c">送られた URL か QR からなら、そのまま入れる</p>
  </div>
</section>

<!-- ⑨ ルール設定（絵 home_v154 ③）＝js/gamen-rules.mjs -->
<section id="vRules" class="view" hidden>
  <div class="obi obi-warn" id="cMemo" hidden>前のルールが読めないので、いつものルールで出しています。</div>
  <div id="cRules"></div>
  <div class="err" id="cErr"></div>
  <button class="btn btn-main" type="button" id="btnCreate">この設定で部屋を作る</button>
</section>

<!-- ⑩ 部屋ができた（絵 home_v154 ④・管理の合言葉は v18.3 で無し） -->
<section id="vMade" class="view" hidden>
  <div class="card h-made">
    <p class="r-hint">部屋名</p>
    <div class="h-no h-name" id="mName"></div>
    <p class="r-hint" id="mPass"></p>
    <div class="qr" id="mQr"></div>
    <div class="h-url" id="mUrl"></div>
    <div class="h-kyk"><button class="btn btn-line" type="button" id="btnCopy">URL を写す</button><button class="btn btn-line" type="button" id="btnQr">QR を見せる</button></div>
  </div>
  <button class="btn btn-main" type="button" id="btnToRoom">この設定で対局を始める</button>
</section>

<!-- URL で入っている途中 -->
<section id="vUrlJoin" class="view" hidden>
  <p id="uMsg">部屋に入っています…</p>
  <div class="err" id="uErr"></div>
  <button class="btn" type="button" id="btnUrlRetry" hidden>もう一度</button>
</section>

<!-- 部屋の中（対局の1ページ）＝js/gamen-taikyoku-room.mjs -->
<section id="vRoom" class="view" hidden></section>
</main>
<script type="module" src="/js/gamen-taikyoku.mjs"></script>
</body>
</html>
