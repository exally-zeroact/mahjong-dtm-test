name: CI
# diag-swb only (never merge): loop sw e2e to catch Pattern B ('c 2nd page band') — 3 parallel workers = load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm i --no-save playwright@1.60.0
          npx playwright install --with-deps webkit
      - name: loop
        shell: bash
        run: |
          set +e
          work() {
            local w=$1 red=0
            for i in $(seq 1 200); do
              node tests/e2e/sw.e2e.mjs > o$w.txt 2>&1; c=$?
              if [ $c -ne 0 ]; then red=$((red+1)); { echo "=== worker $w run $i exit=$c"; cat o$w.txt; } >> red$w.txt; fi
            done
            echo "worker $w red=$red / 200" >> red$w.txt
          }
          work 1 & work 2 & work 3 & wait
          cat red1.txt red2.txt red3.txt
