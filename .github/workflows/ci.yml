name: CI
# diag-swb only (never merge): loop sw e2e to catch Pattern B ('c 2nd page band')
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm i --no-save playwright@1.60.0
          npx playwright install --with-deps webkit
      - name: loop
        shell: bash
        run: |
          set +e
          red=0
          for i in $(seq 1 60); do
            if [ $i -le 2 ]; then export DIAG_ALL=1; else unset DIAG_ALL; fi
            node tests/e2e/sw.e2e.mjs > o.txt 2>&1; c=$?
            if [ $c -ne 0 ] || [ $i -le 2 ]; then echo "=== run $i exit=$c"; cat o.txt; fi
            [ $c -ne 0 ] && red=$((red+1))
          done
          echo "TOTAL red=$red / 60"
